<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="An Omarchy bar across the top, a sun on its arc over the words Chad Peppers: open source, built with agents, on Omarchy">
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#1a1b26"/>
    <!-- the bar -->
    <rect x="0" y="0" width="1200" height="44" fill="#16161e"/>
    <g font-family="JetBrains Mono, Cascadia Mono, Noto Sans Mono, monospace" font-size="13">
      <rect x="20" y="12" width="22" height="20" rx="5" fill="#7aa2f7"/>
      <text x="31" y="26" text-anchor="middle" fill="#1a1b26" font-weight="700">1</text>
      <text x="58" y="26" fill="#565f89">2</text>
      <text x="76" y="26" fill="#565f89">3</text>
      <text x="94" y="26" fill="#565f89">4</text>
      <text x="600" y="26" text-anchor="middle" fill="#a9b1d6">Sat Sep 6  9:41 AM</text>
      <circle cx="905" cy="22" r="6" fill="#7aa2f7"/>
      <text x="918" y="26" fill="#a9b1d6">Sun Clock</text>
      <circle cx="1020" cy="22" r="6" fill="none" stroke="#a9b1d6" stroke-width="2"/>
      <text x="1033" y="26" fill="#a9b1d6">2h 14m</text>
      <text x="1122" y="26" fill="#a9b1d6">▂▄▆</text>
      <text x="1178" y="26" text-anchor="end" fill="#a9b1d6">⏻</text>
    </g>
    <!-- the words -->
    <g font-family="Noto Sans, Segoe UI, Helvetica, Arial, sans-serif">
      <text x="56" y="150" font-size="58" font-weight="700" fill="#c0caf5" letter-spacing="-1">Chad Peppers</text>
      <text x="58" y="192" font-size="22" fill="#a9b1d6">Open source, built with agents, on Omarchy.</text>
      <text x="58" y="246" font-size="15" fill="#565f89" letter-spacing="1.5">THE BAR   ·   THE ASSISTANT   ·   THE LAB</text>
    </g>
    <!-- a sky from the Sun Clock -->
    <rect x="720" y="70" width="440" height="222" rx="12" fill="#1f2335"/>
    <text x="744" y="102" font-family="Noto Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#c0caf5">It's afternoon here in Chicago.</text>
    <path d="M760 272 A180 160 0 0 1 1120 272" fill="none" stroke="#414868" stroke-width="2" stroke-dasharray="6 8"/>
    <line x1="744" y1="272" x2="1136" y2="272" stroke="#414868" stroke-width="2"/>
    <circle cx="780" cy="197" r="26" fill="none" stroke="#7aa2f7" stroke-width="3" stroke-dasharray="7 6" opacity="0.8"/>
    <circle cx="1006" cy="121" r="22" fill="#7aa2f7"/>
  </g>
</svg>
