<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Chad Peppers: open source, built with agents, in the open. Beside the name, a terminal shows a gated workflow run passing plan, code, test and complete.">
  <defs><clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath></defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0F1A2B"/>
    <g font-family="Bricolage Grotesque, Segoe UI, Noto Sans, Helvetica, Arial, sans-serif">
      <text x="56" y="128" font-size="60" font-weight="800" fill="#EEF0F3" letter-spacing="-1.5">Chad Peppers</text>
      <text x="58" y="170" font-size="22" fill="#9AA6BA">Open source, built with agents, in the open.</text>
      <text x="58" y="214" font-size="15" fill="#F5904D" letter-spacing="1.5">DROOST   ·   AGENT-BRIDGE   ·   JQSTAR   ·   OMARCHY</text>
      <text x="58" y="252" font-size="14" fill="#55627A">Co-founder of Ignibyte  ·  Rust, Drupal, MCP  ·  Kansas City</text>
    </g>
    <!-- a run through the gates -->
    <rect x="700" y="40" width="450" height="220" rx="12" fill="#16233A"/>
    <circle cx="722" cy="62" r="5" fill="#9AA6BA" opacity="0.45"/>
    <circle cx="738" cy="62" r="5" fill="#9AA6BA" opacity="0.45"/>
    <circle cx="754" cy="62" r="5" fill="#9AA6BA" opacity="0.45"/>
    <g font-family="JetBrains Mono, Cascadia Mono, Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="15">
      <text x="774" y="67" font-size="12" fill="#9AA6BA">workflow · run</text>
      <text x="724" y="108" fill="#F5904D">$</text><text x="744" y="108" fill="#EEF0F3">workflow run</text>
      <text x="724" y="142" fill="#EEF0F3">plan</text><text x="860" y="142" fill="#9AA6BA">gate passed</text><text x="1108" y="142" fill="#7BC47F">✓</text>
      <text x="724" y="172" fill="#EEF0F3">code</text><text x="860" y="172" fill="#9AA6BA">gate passed</text><text x="1108" y="172" fill="#7BC47F">✓</text>
      <text x="724" y="202" fill="#EEF0F3">test</text><text x="860" y="202" fill="#9AA6BA">gate passed</text><text x="1108" y="202" fill="#7BC47F">✓</text>
      <text x="724" y="232" fill="#EEF0F3">complete</text><text x="860" y="232" fill="#9AA6BA">receipt written</text><text x="1108" y="232" fill="#7BC47F">✓</text>
    </g>
  </g>
</svg>
